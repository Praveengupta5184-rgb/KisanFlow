name: KisanFlow CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: kisanflow-backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: mvn -B test
  python:
    runs-on: ubuntu-latest
    strategy: { matrix: { service: [kisanflow-ai-service, kisanflow-simulation-service] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install -r ${{ matrix.service }}/requirements.txt pytest
      - run: pytest ${{ matrix.service }}/tests
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: kisanflow-frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: kisanflow-frontend/package-lock.json }
      - run: npm install
      - run: npm test
      - run: npm run build
  images:
    runs-on: ubuntu-latest
    needs: [backend, python, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
